[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configure-env-py"
version = "0.1.0"
description = "Interactive CLI wizard that creates or updates a .env file from a .env.example template."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Richard McQuiston" }]
keywords = ["dotenv", "env", "cli", "configuration", "environment-variables"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/RichardMcQuiston01/configure-env-py"
Issues = "https://github.com/RichardMcQuiston01/configure-env-py/issues"

[project.scripts]
configure-env = "configure_env.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/configure_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
